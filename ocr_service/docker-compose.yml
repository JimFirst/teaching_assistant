services:
  ocr_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddleocr_service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - DEBUG=false
      - OCR_USE_GPU=false
      - OCR_USE_ANGLE_CLS=true
      - OCR_LANG=ch
      - MAX_FILE_SIZE=10485760
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
